name: Build Windows releases

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src | Out-Null
          tar -xf source/PerimeterAudit_Source.tar.xz -C src
          if ($LASTEXITCODE -ne 0) { throw 'Source archive extraction failed' }

      - name: Apply compatibility fix
        shell: pwsh
        run: |
          $source = 'src/PerimeterAudit/MailAudit.cs'
          if (Test-Path $source) {
            $content = Get-Content -LiteralPath $source -Raw
            $content = $content.Replace('Dns.GetHostEntryAsync(addr, token)', 'Dns.GetHostEntryAsync(addr)')
            Set-Content -LiteralPath $source -Value $content -Encoding utf8
          }

      - name: Set application version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = "1.0.$env:GITHUB_RUN_NUMBER"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "Application version: $version"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish portable single-file EXE
        shell: pwsh
        run: |
          dotnet publish src/PerimeterAudit/PerimeterAudit.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$env:APP_VERSION `
            --output src/PerimeterAudit/publish
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src/PerimeterAudit/publish/PerimeterAudit.exe dist/PerimeterAudit.exe
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "/Odist" src/PerimeterAudit/setup/PerimeterAudit.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PerimeterAudit-Windows-x64
          path: |
            dist/PerimeterAudit.exe
            dist/PerimeterAudit-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/PerimeterAudit.exe
            dist/PerimeterAudit-Setup.exe
